[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenroom"
version = "0.1.0"
description = "Staff-reviewed indexing of long-form youth arts video for The Performance Academy (AI4Good Hackathon 2026, Problem Case 1, Track A)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.4.9",
    "streamlit>=1.35",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Installed in Phase 1. torch is expected from the system site-packages (CUDA build already present).
ml = [
    "transformers>=4.45",
    "accelerate>=0.30",
    "faster-whisper>=1.0",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scenedetect[opencv]>=0.6",
    "sentencepiece",
    "requests>=2.31",
]
dev = ["pytest>=8"]

[project.scripts]
greenroom = "greenroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
