# Development profile: RTX 4090 laptop (16 GB VRAM), 64 GB RAM.
# Stages run one after another and release the GPU between them.
name: rtx4090
device: cuda
window_seconds: 5

asr:
  backend: faster-whisper
  model: large-v3
  compute_type: float16
  vad_filter: true
  no_speech_threshold: 0.6
  language: en

audio_events:
  clap_model: laion/larger_clap_music_and_speech
  clap_fallback_model: laion/clap-htsat-unfused
  ast_model: MIT/ast-finetuned-audioset-10-10-0.4593   # second audio channel; null disables
  analysis_window_seconds: 10
  hop_seconds: 5

vision:
  model: google/siglip-so400m-patch14-384
  frames_per_window: 4
  frame_height: 384
  sample_fps: 1.0
  detector: facebook/detr-resnet-50
  detector_person_threshold: 0.7

transcript_llm:
  backend: ollama
  model: qwen2.5:7b-instruct
  context_pad_seconds: 20
  temperature: 0.0
  think: false

vlm:
  model: Qwen/Qwen2.5-VL-7B-Instruct
  frames: 8
  candidates_only: true
  max_new_tokens: 80

fusion:
  prior_weight: 2.0
  # Evidence weights and thresholds below are placeholders; they are fitted on
  # the calibration split (PLAN.md section 8) and overwritten by fit output.
  evidence_weight:
    audio: 10.0
    vision: 10.0
    transcript: 5.0
  thresholds:
    secondary_min_projected: 0.35
    review_required_uncertainty: 0.5
    review_required_conflict: 0.3
    mixed_activity_margin: 0.1

energy:
  nvml: true
