# Deployable profile: a single T4-class GPU (16 GB) or comparable low-cost box.
# Same pipeline, smaller models, fewer frames; the ablation measures what is lost.
name: t4
device: cuda
window_seconds: 5

asr:
  backend: faster-whisper
  model: distil-large-v3
  compute_type: int8_float16
  vad_filter: true
  no_speech_threshold: 0.6
  language: en

audio_events:
  clap_model: laion/larger_clap_music_and_speech
  clap_fallback_model: laion/clap-htsat-unfused
  ast_model: null
  analysis_window_seconds: 10
  hop_seconds: 5

vision:
  xclip_model: microsoft/xclip-base-patch32      # 8 frames per window
  videomae_model: MCG-NJU/videomae-base-finetuned-kinetics
  sample_fps: 4.0
  frame_height: 224
  batch_size: 4
  dark_luminance: 12
  full_quality_luminance: 50
  siglip_model: null
  detector: facebook/detr-resnet-50
  detector_person_threshold: 0.7

transcript_llm:
  backend: ollama
  model: qwen2.5:3b-instruct
  context_pad_seconds: 20
  temperature: 0.0
  think: false

vlm:
  model: Qwen/Qwen2.5-VL-3B-Instruct
  frames: 4
  candidates_only: true
  max_new_tokens: 80

fusion:
  prior_weight: 2.0
  base_rate_default: 0.1
  channels:
    audio:
      pos: 10.0
      neg: 4.0
      score_mode: relative_top
      competitors: 7
    xclip:
      pos: 10.0
      neg: 4.0
      score_mode: relative_top
      competitors: 15
    videomae:
      pos: 10.0
      neg: 1.5
      score_mode: raw
      competitors: 400
    transcript:
      pos: 5.0
      neg: 2.0
      score_mode: raw
      competitors: 2
  thresholds:
    secondary_min_projected: 0.35
    review_required_uncertainty: 0.5
    review_required_conflict: 0.4
    review_required_min_projected: 0.5
    mixed_activity_margin: 0.1

energy:
  nvml: true
